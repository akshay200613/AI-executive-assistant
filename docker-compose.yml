version: "3.9"

services:
  api:
    build: .
    container_name: aea_api
    ports:
      - "8080:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  ui:
    build: .
    container_name: aea_ui
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
